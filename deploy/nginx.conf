# GeoAgent — nginx reverse proxy (ISS-009)
#
# `docker-compose.yml` mounts this file at /etc/nginx/conf.d/default.conf, but
# `deploy/` did not exist, so `docker compose up` failed on the nginx service:
# Docker creates a DIRECTORY at the missing bind-mount path, nginx then finds no
# server block and serves its default page. This file closes that.
#
# The one thing this config must get right is SSE. `/api/agent` streams the whole
# agentic loop over a single long-lived response, and nginx's defaults break it
# two different ways:
#
#   * `proxy_buffering on` (the default) holds the response until a buffer fills,
#     so tokens arrive in bursts or not at all — the stream still "works" in a
#     curl smoke test while feeling frozen in the browser;
#   * `proxy_read_timeout 60s` (the default) kills a stream that is silent for a
#     minute. The route emits a `: keep-alive` comment every 15 s for exactly
#     this reason (ISS-007), but a cold Ollama load can still exceed 60 s of
#     upstream silence before the first byte, so the timeout is raised too.
#
# Both are set explicitly below rather than relied on.

# conf.d/*.conf is included inside nginx's `http` block, so `map` is legal here.
# Without it `$connection_upgrade` is an undefined variable and nginx refuses to
# load the config at all.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream geoagent_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot HTTP-01 challenge. Uncomment together with the certbot volumes in
    # docker-compose.yml. No SSL bootstrap script ships with this repo yet — the
    # 443 block below stays commented until certificates actually exist, because
    # an `ssl_certificate` pointing at a missing file stops nginx from starting.
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # Tier-2 GeoTIFF/COG upload (ENABLE_UPLOADS). nginx's 1 MB default would
    # reject any real raster with a 413 before it reached the app.
    client_max_body_size 512m;

    # Long enough for a slow upload of the above without a spurious 408.
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    # SSE is `text/event-stream`; compressing it would add another buffering
    # layer on top of the one disabled below. Deliberately not gzipped.

    # ── The SSE agent stream ────────────────────────────────────────────────
    location /api/agent {
        proxy_pass http://geoagent_app;
        proxy_http_version 1.1;

        # Buffering off, or tokens arrive in bursts instead of as they stream.
        proxy_buffering off;
        proxy_cache off;
        # X-Accel-Buffering is the header a Next.js route can set to ask for the
        # same thing; honour it rather than overriding.
        proxy_set_header X-Accel-Buffering no;

        # The client disconnecting must reach the route so its AbortController
        # cancels in-flight upstream work (P7.3), rather than nginx quietly
        # holding the connection open.
        proxy_ignore_client_abort off;

        # A cold local model can be silent for well over nginx's 60 s default
        # before the first token. The route's own cap is 120 s (maxDuration).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # ── Everything else ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://geoagent_app;
        proxy_http_version 1.1;

        # Next.js dev/HMR and any future websocket use.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # Liveness probe — bypasses the app's own logging noise.
    location = /api/health {
        proxy_pass http://geoagent_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

